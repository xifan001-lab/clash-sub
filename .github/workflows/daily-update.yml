name: daily-update-subscription

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Install mihomo
        run: |
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.10/mihomo-linux-amd64-v1.19.10.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
      - name: Fetch + TCP prescan + test + build
        run: |
          python scripts/pipeline_ci.py
      - name: Commit if changed
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          if git diff --quiet -- clash.yaml; then
            echo "No changes"
          else
            git add clash.yaml
            git commit -m "auto: refresh subscription $(date -u +%F)"
            git push
          fi
